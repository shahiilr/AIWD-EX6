<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration - MEMS</title>
    
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>📝 Event Registration</h1>
        </header>

        <div class="nav-container">
            <a href="event.html" class="back-link">Back to Events</a>
        </div>

        <div class="form-container">
            <h2>Registration Form</h2>

            <form id="regForm">
                <label for="name">👤 Participant Name *</label>
                <input type="text" id="name" placeholder="Enter your full name" required>

                <label for="email">📧 Email Address *</label>
                <input type="email" id="email" placeholder="your.email@example.com" required>

                <label for="eventName">🎯 Event Name</label>
                <input type="text" id="eventName" readonly>

                <label for="mobile">📱 Mobile Number *</label>
                <input type="tel" id="mobile" placeholder="Enter 10-digit mobile number" required>

                <div style="margin-top: 30px;">
                    <button type="button" id="submitBtn">Submit Registration</button>
                    <button type="button" id="resetBtn">Reset Form</button>
                </div>
            </form>

            <div id="message"></div>
        </div>
    </div>
</body>
</html>
